name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  # Shows the gate doing its job: clean data passes, broken data must be blocked.
  gate-demo:
    needs: test
    runs-on: ubuntu-24.04
    env:
      AS_OF: "2026-10-26T23:59:00+00:00"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .

      - name: Clean batch passes the gate
        run: pipeguard run examples/orders.yaml --as-of "$AS_OF"

      - name: Broken batch is blocked (expects exit 1)
        run: |
          set +e
          pipeguard run examples/orders.yaml --data examples/orders_bad.csv \
            --as-of "$AS_OF" --json-out reports/orders_bad.json
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1

      - uses: actions/upload-artifact@v6
        with:
          name: gate-report
          path: reports/
